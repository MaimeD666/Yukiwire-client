name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-v0.4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: '38426908809'
      BUILD_COMMIT: d2e7998597b8d8df068bbf2a3a00079627b60b08
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_TAG: v0.4
      ARTIFACT_NAME: Yukiwire-0.4-win-x64
    steps:
      - name: Check the tested source revision
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > build-run.json
          gh api "repos/$GH_REPO/git/trees/$BUILD_COMMIT?recursive=1" > tested-tree.json
          gh api "repos/$GH_REPO/git/trees/$RELEASE_COMMIT?recursive=1" > release-tree.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('build-run.json'))
          expected = {
              'status': 'completed', 'conclusion': 'success',
              'head_sha': os.environ['BUILD_COMMIT'], 'head_branch': 'main',
              'event': 'push', 'path': '.github/workflows/check.yml',
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f'Unexpected build {key}: {run.get(key)!r}')
          if run['repository']['full_name'] != os.environ['GH_REPO']:
              raise SystemExit('Build belongs to another repository')
          def sources(filename):
              tree = json.load(open(filename))
              if tree.get('truncated'):
                  raise SystemExit('Incomplete source tree')
              return {entry['path']: (entry['mode'], entry['type'], entry['sha'])
                      for entry in tree['tree'] if entry['type'] != 'tree'
                      and entry['path'] != '.github/workflows/release.yml'}
          if sources('tested-tree.json') != sources('release-tree.json'):
              raise SystemExit('Release source differs from the tested build')
          PY

      - name: Download and verify the tested packages
        run: |
          gh run download "$BUILD_RUN_ID" --name "$ARTIFACT_NAME" --dir release-assets
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, zipfile
          folder = pathlib.Path('release-assets')
          stem = os.environ['ARTIFACT_NAME']
          packages = {stem + '.zip', stem + '-setup.exe'}
          if {p.name for p in folder.iterdir()} != packages | {'SHA256SUMS.txt'}:
              raise SystemExit('Unexpected release files')
          checksums = {}
          for line in (folder / 'SHA256SUMS.txt').read_text().splitlines():
              match = re.fullmatch(r'([0-9a-f]{64})  (.+)', line)
              if not match or match[2] not in packages or match[2] in checksums:
                  raise SystemExit('Invalid checksum manifest')
              checksums[match[2]] = match[1]
          if set(checksums) != packages:
              raise SystemExit('Incomplete checksum manifest')
          for name, expected in checksums.items():
              if hashlib.sha256((folder / name).read_bytes()).hexdigest() != expected:
                  raise SystemExit(f'Checksum mismatch: {name}')
          with zipfile.ZipFile(folder / (stem + '.zip')) as archive:
              metadata = json.loads(archive.read('Yukiwire/portable.json'))
              if metadata.get('version') != '0.4' or not metadata.get('tun_available'):
                  raise SystemExit('Wrong portable package')
          PY

      - name: Upload a draft release
        run: |
          cat > release-notes.md <<'NOTES'
          Yukiwire для **Windows 10/11 x64**.

          - **setup.exe** — обычная установка с ярлыками.
          - **.zip** — portable: распакуй и запусти `Yukiwire.exe`.

          Добавь свою ссылку подключения и нажми «Подключиться». Сервер в комплект не входит.

          В этой версии:

          - Игры без VPN: Dota 2, Counter-Strike 2 и выбранные `.exe` подключаются напрямую; остальные приложения сохраняют свои маршруты.
          - Обновлённый экран маршрутов: «Все, кроме РФ», «Все сайты», «По списку» и понятные исключения.
          - Сохранение настроек при включённом VPN и отдельный переключатель «Переподключаться после изменений».
          - Системный прокси вместе с TUN для браузеров, с восстановлением исходных настроек сети при отключении.
          - Проверки доступности сайтов через фактический путь TUN и сравнение с VPN-прокси.

          Если YouTube теряет связь при совместной работе TUN и zapret, включите «Системный прокси вместе с TUN» в настройках подключения. Совместимость чистого TUN с этой конфигурацией сетевого фильтра пока не исправлена.

          Контрольные суммы установщика и portable-архива — в `SHA256SUMS.txt`.
          NOTES
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT" > tag.json
          gh release create "$RELEASE_TAG" \
            "release-assets/$ARTIFACT_NAME-setup.exe" \
            "release-assets/$ARTIFACT_NAME.zip" \
            release-assets/SHA256SUMS.txt \
            --draft --prerelease=false --verify-tag --target "$RELEASE_COMMIT" \
            --title 'Yukiwire 0.4' --notes-file release-notes.md

      - name: Verify uploaded assets and publish
        run: |
          gh api "repos/$GH_REPO/releases" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\")" > release.json
          gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > tag.json
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          release = json.load(open('release.json'))
          tag = json.load(open('tag.json'))
          if not release['draft'] or release['prerelease']:
              raise SystemExit('Expected a regular draft release')
          if release['target_commitish'] != os.environ['RELEASE_COMMIT']:
              raise SystemExit('Wrong release target')
          if tag['object']['type'] != 'commit' or tag['object']['sha'] != os.environ['RELEASE_COMMIT']:
              raise SystemExit('Wrong release tag')
          files = {p.name: p for p in pathlib.Path('release-assets').iterdir()}
          if {a['name'] for a in release['assets']} != set(files):
              raise SystemExit('Incomplete release upload')
          for asset in release['assets']:
              path = files[asset['name']]
              digest = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
              if asset['state'] != 'uploaded' or asset['size'] != path.stat().st_size or asset.get('digest') != digest:
                  raise SystemExit(f'Upload verification failed: {path.name}')
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          gh api "repos/$GH_REPO/releases/latest" > latest.json
          python3 - <<'PY'
          import json, os
          release = json.load(open('latest.json'))
          if release['tag_name'] != os.environ['RELEASE_TAG'] or release['draft'] or release['prerelease']:
              raise SystemExit('Release was not published as the latest regular release')
          print(release['html_url'])
          PY
