name: Checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.test.outputs.version }}
      package:
        value: ${{ jobs.test.outputs.package }}
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      package: ${{ steps.version.outputs.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - id: version
        run: |
          python -c "import os; from yukiwire.version import VERSION, PACKAGE_NAME; assert os.environ['GITHUB_REF_TYPE'] != 'tag' or os.environ['GITHUB_REF_NAME'] == 'v' + VERSION; open(os.environ['GITHUB_OUTPUT'], 'a').write('version=' + VERSION + '\npackage=' + PACKAGE_NAME + '\n')"
      - run: python scripts/download_installer_tools.py
      - run: python -B -m unittest discover -s tests -v
      - run: python scripts/download_core.py
      - run: python -B -m unittest discover -s tests -v
      - run: python -m compileall -q yukiwire scripts
      - run: python scripts/verify_production.py
      - run: python scripts/build_native.py --test
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verify_ui.py
      - run: python scripts/verify_browser_proxy.py
      - run: python scripts/verify_helper_crash.py
      - run: python -c "import subprocess; subprocess.run(['runtime/Yukiwire.Test.exe', '--smoke'], check=True, timeout=20)"
      - run: python -c "import subprocess; subprocess.run(['runtime/Yukiwire.Test.exe', '--smoke-connected'], check=True, timeout=20)"
      - run: python scripts/download_wintun.py
      - run: python scripts/build_portable.py
      - run: python scripts/verify_portable.py dist/${{ steps.version.outputs.package }}.zip --native
      - run: python scripts/build_installer.py
      - run: python scripts/verify_installer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yukiwire-windows
          if-no-files-found: error
          path: |
            dist/${{ steps.version.outputs.package }}.zip
            dist/${{ steps.version.outputs.package }}-setup.exe
            dist/SHA256SUMS.txt
