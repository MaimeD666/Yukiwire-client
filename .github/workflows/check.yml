name: Checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/download_core.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q yukiwire scripts
      - run: python scripts/build_native.py
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verify_ui.py
      - run: python scripts/verify_browser_proxy.py
      - run: python scripts/verify_helper_crash.py
      - run: python -c "import subprocess; subprocess.run(['runtime/Yukiwire.exe', '--smoke'], check=True, timeout=20)"
      - run: python -c "import subprocess; subprocess.run(['runtime/Yukiwire.exe', '--smoke-connected'], check=True, timeout=20)"
      - run: python scripts/download_wintun.py
      - run: python scripts/build_portable.py
      - run: python scripts/verify_portable.py dist/Yukiwire-0.4-preview-win-x64.zip --native
      - run: python scripts/build_installer.py
      - run: python scripts/verify_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: Yukiwire-0.4-preview-win-x64
          if-no-files-found: error
          path: |
            dist/Yukiwire-0.4-preview-win-x64.zip
            dist/Yukiwire-0.4-preview-win-x64-setup.exe
            dist/SHA256SUMS.txt
